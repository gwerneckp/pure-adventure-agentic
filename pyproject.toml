[project]
name = "adventure-game-agentic"
version = "0.1.0"
description = "AI agentic play-through of the Pure Adventure Haskell game"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "openhands-sdk",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.py"]
