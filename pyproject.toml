[project]
name = "pure-adventure-agentic"
version = "0.1.0"
description = "AI agentic play-through of the Pure Adventure Haskell game"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "openhands-sdk",
    "python-dotenv",
]

[project.scripts]
adventure = "adventure.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.py"]
